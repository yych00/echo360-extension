<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo360 CC 字幕助手</title>
    <style>
        /* ========================================
         * Echo360 CC 字幕助手 — 极简紧凑专业设计体系
         * (基于 Canvas Copilot 精细 UI 体系)
         * ======================================== */

        :root {
            --bg-panel: #18181b;
            --bg-card: #27272a;
            --bg-card-hover: #2f2f35;
            --bg-toolbar: #202023;
            --bg-input: #1f1f23;
            --bg-input-hover: #2a2a30;
            --bg-hover: #3f3f46;
            
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-tertiary: #71717a;
            
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.35);
            --accent-green: #10b981;
            
            --border: #38383e;
            --border-subtle: #27272a;
            --border-focus: #3b82f6;
            
            --radius-sm: 4px;
            --radius-md: 6px;
            --radius-full: 9999px;
            
            --transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'Cascadia Code', 'Fira Code', Consolas, monospace;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-ui);
            font-size: 12px;
            background-color: var(--bg-panel);
            color: var(--text-primary);
            line-height: 1.4;
            width: 350px;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            overflow-y: auto;
            user-select: none;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: var(--radius-full);
        }

        /* 头部导航栏 */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 38px;
            padding: 0 12px;
            background: var(--bg-toolbar);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .brand-icon {
            width: 18px;
            height: 18px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: #ffffff;
            font-weight: 800;
            font-size: 10px;
            box-shadow: 0 2px 4px var(--accent-glow);
        }

        .brand-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .version-badge {
            font-size: 10px;
            font-family: var(--font-mono);
            font-weight: 600;
            background: var(--bg-input);
            color: var(--text-secondary);
            padding: 1px 5px;
            border-radius: 3px;
            border: 1px solid var(--border);
        }

        /* 页面主体 */
        .content-container {
            padding: 8px 10px 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 7px 9px;
            transition: var(--transition);
        }

        .card:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        .card-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 5px;
            display: block;
        }

        /* 开关控件 */
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 0;
        }

        .switch-row + .switch-row {
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px solid var(--border-subtle);
        }

        .switch-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            cursor: pointer;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 32px;
            height: 18px;
            flex-shrink: 0;
            margin: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            transition: var(--transition);
            border-radius: var(--radius-full);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 2px;
            top: 2px;
            background-color: var(--text-secondary);
            transition: var(--transition);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 6px var(--accent-glow);
        }

        input:checked + .slider:before {
            transform: translateX(14px);
            background-color: #ffffff;
        }

        /* 模式选择按钮 */
        .mode-btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .mode-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 5px 8px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: var(--transition);
            user-select: none;
        }

        .mode-btn:hover {
            background: var(--bg-input-hover);
            color: var(--text-primary);
        }

        .mode-btn input[type="checkbox"] {
            display: none;
        }

        .mode-btn.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.18);
            color: #93c5fd;
        }

        /* 表单控件 */
        .form-row {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .unit-badge {
            font-size: 9px;
            color: var(--text-tertiary);
            font-family: var(--font-mono);
        }

        select,
        input[type="number"] {
            width: 100%;
            height: 25px;
            padding: 0 7px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }

        select:focus,
        input[type="number"]:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        select {
            cursor: pointer;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .color-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1px 0;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
        }

        input[type="color"] {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: transparent;
            border: 2px solid var(--border);
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            transition: var(--transition);
        }

        input[type="color"]:hover {
            transform: scale(1.1);
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        /* 滑块 */
        .range-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="range"] {
            flex: 1;
            appearance: none;
            -webkit-appearance: none;
            height: 4px;
            border-radius: var(--radius-full);
            background: var(--bg-input);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 4px var(--accent-glow);
            transition: var(--transition);
        }

        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border: none;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 4px var(--accent-glow);
            transition: var(--transition);
        }

        .range-value {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            width: 26px;
            text-align: right;
        }

        /* 进度条 */
        .progress-bar-container {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            overflow: hidden;
            height: 18px;
            position: relative;
            margin-top: 2px;
        }

        #optionProgressBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            transition: width 0.3s ease;
        }

        #optionProgressText {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        /* 可折叠详情组件 */
        details.export-details {
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            overflow: hidden;
            margin-top: 4px;
        }

        details.export-details summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            list-style: none;
            user-select: none;
            transition: var(--transition);
        }

        details.export-details summary::-webkit-details-marker {
            display: none;
        }

        details.export-details summary:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }

        .summary-arrow {
            font-size: 12px;
            color: var(--text-tertiary);
            transition: transform 0.2s ease;
            display: inline-block;
        }

        details[open] .summary-arrow {
            transform: rotate(90deg);
        }

        /* 导出详细信息内容 */
        .export-meta {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            padding: 5px 8px;
            border-top: 1px solid var(--border-subtle);
            background: rgba(0, 0, 0, 0.15);
        }

        .export-meta strong {
            color: var(--text-primary);
        }

        .muted-status {
            color: var(--text-tertiary);
            font-size: 10px;
            text-align: center;
            margin-top: 2px;
        }

        .muted-status:empty {
            display: none;
        }

        /* 实时预览 */
        .preview-wrapper {
            position: relative;
            background: radial-gradient(circle at center, #27272a 0%, #18181b 100%);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px 8px 8px;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-badge {
            position: absolute;
            top: 2px;
            left: 5px;
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--text-tertiary);
            background: rgba(0, 0, 0, 0.4);
            padding: 1px 4px;
            border-radius: 2px;
        }

        .preview-box {
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            text-align: center;
            max-width: 95%;
            transition: var(--transition);
        }

        .preview-en {
            opacity: 0.9;
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .preview-zh {
            font-weight: 700;
            line-height: 1.2;
        }

        /* 按钮 */
        .btn-group {
            display: flex;
            gap: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 27px;
            padding: 0 10px;
            font-size: 12px;
            font-weight: 600;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            font-family: inherit;
        }

        .btn-primary {
            flex: 1;
            background: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-secondary {
            background: var(--bg-input);
            border-color: var(--border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-secondary:disabled {
            background: var(--bg-input);
            border-color: var(--border);
            color: var(--text-tertiary);
            cursor: not-allowed;
        }

        /* 导出双语按钮：绿色透明底 + 绿色边框与文字，风格与模式选中按钮一致 */
        .btn-success {
            background: rgba(16, 185, 129, 0.15);
            border-color: #10b981;
            color: #34d399;
        }

        .btn-success:hover:not(:disabled) {
            background: rgba(16, 185, 129, 0.25);
            border-color: #34d399;
            color: #6ee7b7;
        }

        .btn-success:disabled {
            background: var(--bg-input);
            border-color: var(--border);
            color: var(--text-tertiary);
            cursor: not-allowed;
        }

        #status {
            color: var(--accent-green);
            font-size: 11px;
            font-weight: 600;
            text-align: center;
            transition: var(--transition);
        }

        #status:empty {
            display: none;
        }

        .footer-note {
            text-align: center;
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 2px;
        }
    </style>
</head>

<body>
    <!-- 顶部导航栏 -->
    <header class="app-header">
        <div class="brand-container">
            <div class="brand-icon">CC</div>
            <span class="brand-text">Echo360 CC 字幕助手</span>
        </div>
        <div class="header-badges">
            <span class="version-badge">v1.1.0</span>
        </div>
    </header>

    <div class="content-container">
        <!-- 核心开关卡片 -->
        <div class="card">
            <div class="switch-row">
                <label for="enableSubtitles" class="switch-label">启用 CC 字幕</label>
                <label class="switch">
                    <input type="checkbox" id="enableSubtitles" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="switch-row">
                <label for="keyboardShortcuts" class="switch-label">键盘快进快退 (← →)</label>
                <label class="switch">
                    <input type="checkbox" id="keyboardShortcuts" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- 显示语言轨迹 -->
        <div class="card">
            <span class="card-title">显示语言轨迹</span>
            <div class="mode-btn-group">
                <label class="mode-btn" id="showChineseBtn">
                    <input type="checkbox" id="showChinese" checked>
                    <span>中文字幕</span>
                </label>
                <label class="mode-btn" id="showEnglishBtn">
                    <input type="checkbox" id="showEnglish" checked>
                    <span>英文字幕</span>
                </label>
            </div>
        </div>

        <!-- 数据导出卡片 (含后台翻译缓存进度与可折叠详情，放显示语言轨迹后面) -->
        <div class="card">
            <span class="card-title">数据导出与翻译进度</span>

            <div class="form-row">
                <span class="form-label">后台翻译缓存进度</span>
                <div class="progress-bar-container">
                    <div id="optionProgressBar"></div>
                    <div id="optionProgressText">暂无活跃任务 (请播放视频同步进度)</div>
                </div>
            </div>

            <details class="export-details" id="exportDetails">
                <summary>
                    <span id="exportSummaryText">查看字幕缓存详情</span>
                    <span class="summary-arrow">›</span>
                </summary>
                <div class="export-meta" id="exportMeta">
                    暂无字幕缓存。请先打开 Echo360 视频页面并开始播放。
                </div>
            </details>

            <div class="btn-group" style="margin-top: 5px;">
                <button id="exportEnTxtBtn" class="btn btn-secondary" style="flex: 1;" type="button" disabled>导出英文
                    TXT</button>
                <button id="exportTxtBtn" class="btn btn-success" style="flex: 1;" type="button" disabled>导出双语
                    TXT</button>
            </div>
            <div id="exportStatus" class="muted-status"></div>
        </div>

        <!-- 排版、色彩风格与语言栏 (含翻译目标语言、字号、透明度、毛玻璃、颜色) -->
        <div class="card">
            <span class="card-title">排版、色彩风格与语言</span>

            <div class="form-row">
                <label for="targetLang" class="form-label">翻译目标语言</label>
                <select id="targetLang">
                    <option value="zh-CN">简体中文 (默认)</option>
                    <option value="zh-TW">繁体中文</option>
                </select>
            </div>

            <div class="grid-2col" style="margin-top: 5px;">
                <div class="form-row">
                    <label for="fontSize" class="form-label">
                        <span>中文大小</span>
                        <span class="unit-badge">PX</span>
                    </label>
                    <input type="number" id="fontSize" value="22" min="12" max="64">
                </div>

                <div class="form-row">
                    <label for="englishFontSize" class="form-label">
                        <span>英文大小</span>
                        <span class="unit-badge">PX</span>
                    </label>
                    <input type="number" id="englishFontSize" value="20" min="12" max="64">
                </div>
            </div>

            <div class="form-row" style="margin-top: 5px;">
                <div class="form-label">
                    <span>背景透明度</span>
                    <span id="bgOpacityValue" class="range-value">0.6</span>
                </div>
                <div class="range-container">
                    <input type="range" id="bgOpacity" min="0" max="1" step="0.05" value="0.6">
                </div>
            </div>

            <div class="switch-row"
                style="margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--border-subtle);">
                <label for="blurEffect" class="switch-label" style="font-size: 11px;">毛玻璃背景滤镜</label>
                <label class="switch">
                    <input type="checkbox" id="blurEffect">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="grid-2col" style="margin-top: 5px;">
                <div class="color-row">
                    <label for="translateColor" class="switch-label" style="font-size: 11px;">中文字体色</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="translateColor" value="#ffffff">
                    </div>
                </div>

                <div class="color-row">
                    <label for="englishColor" class="switch-label" style="font-size: 11px;">英文字体色</label>
                    <div class="color-picker-wrapper">
                        <input type="color" id="englishColor" value="#ffffff">
                    </div>
                </div>
            </div>
        </div>

        <!-- 实时效果预览视口 -->
        <div class="preview-wrapper">
            <span class="preview-badge">Live Preview</span>
            <div class="preview-box" id="previewBox">
                <div class="preview-en" id="previewEn" style="color: #ffffff;">This is the original English text.</div>
                <div class="preview-zh" id="previewZh" style="color: #ffffff;">这里是动态为您翻译的中文效果</div>
            </div>
        </div>

        <!-- 按钮与状态 -->
        <div class="btn-group">
            <button id="resetBtn" class="btn btn-secondary" style="flex: 1;" type="button">恢复默认</button>
            <button id="saveBtn" class="btn btn-primary" style="flex: 1;" type="button">保存配置</button>
        </div>
        <div id="status"></div>

        <div class="footer-note">
            Echo360 CC Subtitle Copilot • Built for Canvas & Echo360
        </div>
    </div>

    <script src="options.js"></script>
</body>

</html>
